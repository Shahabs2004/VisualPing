name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${TAG_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use Major.Minor.Patch format." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: portable-x64
            rid: win-x64
            self-contained: true
            single-file: true
          - label: framework-dependent-x64
            rid: win-x64
            self-contained: false
            single-file: false
          - label: self-contained-x86
            rid: win-x86
            self-contained: true
            single-file: false
          - label: self-contained-arm64
            rid: win-arm64
            self-contained: true
            single-file: false
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish ${{ matrix.label }}
        run: |
          set -euo pipefail
          dotnet publish VisualPing.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained "${{ matrix.self-contained }}" \
            --output "$RUNNER_TEMP/publish" \
            -p:PublishSingleFile="${{ matrix.single-file }}" \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$VERSION"

      - name: Verify package contents
        env:
          PACKAGE_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/publish"
          test -f "$publish_dir/VisualPing.exe"

          if [[ "$PACKAGE_LABEL" == "portable-x64" ]]; then
            file_count=$(find "$publish_dir" -maxdepth 1 -type f | wc -l)
            if [[ "$file_count" -ne 1 ]]; then
              echo "Portable package must contain exactly one file." >&2
              find "$publish_dir" -maxdepth 1 -type f >&2
              exit 1
            fi
          elif [[ "$PACKAGE_LABEL" == "framework-dependent-x64" ]]; then
            test -f "$publish_dir/VisualPing.dll"
            test -f "$publish_dir/VisualPing.runtimeconfig.json"
          else
            test -f "$publish_dir/VisualPing.dll"
          fi

      - name: Prepare release asset
        env:
          PACKAGE_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          if [[ "$PACKAGE_LABEL" == "portable-x64" ]]; then
            cp "$RUNNER_TEMP/publish/VisualPing.exe" \
              "$RUNNER_TEMP/package/VisualPing-$VERSION-$PACKAGE_LABEL.exe"
          fi

      - name: Package application
        if: matrix.label != 'portable-x64'
        shell: pwsh
        env:
          PACKAGE_LABEL: ${{ matrix.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP "package/VisualPing-$env:VERSION-$env:PACKAGE_LABEL.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/*" -DestinationPath $destination

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualPing-${{ matrix.label }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: VisualPing-*
          path: packages
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(packages/*)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected four release assets, found ${#assets[@]}." >&2
            exit 1
          fi

          exe_count=$(find packages -maxdepth 1 -type f -name '*.exe' | wc -l)
          if [[ "$exe_count" -ne 1 ]]; then
            echo "Expected exactly one EXE release asset." >&2
            exit 1
          fi

          test -f "packages/VisualPing-$VERSION-portable-x64.exe"
          test -f "packages/VisualPing-$VERSION-framework-dependent-x64.zip"
          test -f "packages/VisualPing-$VERSION-self-contained-x86.zip"
          test -f "packages/VisualPing-$VERSION-self-contained-arm64.zip"

      - name: Publish public GitHub Release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="VisualPing $VERSION for Windows. Portable x64 is a single self-contained EXE. The other packages are ZIP archives."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* \
              --target "$GITHUB_SHA" \
              --title "VisualPing $VERSION" \
              --notes "$notes"
          fi
